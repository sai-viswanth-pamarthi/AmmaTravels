services:
  - type: web
    name: ammatravels
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 5000
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: AmmaTravels@2026
      - key: STAFF_USERNAME
        value: staff
      - key: STAFF_PASSWORD
        value: Staff@2026
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        value: "918885757966"
      - key: JWT_SECRET
        generateValue: true
